name: Test module
# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
      ui_tests:
        description: "Run the cases tagged ui and publish their screenshots"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run:
    name: "Run tests"
    # Write access to push the screenshots to the ci-screenshots branch.
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      image_name: kuma
      ui_tests_strategy: ${{ github.event.inputs.ui_tests == 'true' && 'always' || 'on_renovate_ui_change' }}
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
      # kuma is not published in a Software Center repository yet, so there is no stable release to update from
      scenarios: '["install"]'
